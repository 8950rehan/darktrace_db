# Development baseline. Keep Redis on a private network.
bind 127.0.0.1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300
databases 2

# Do not use the legacy `requirepass` in production; configure ACL users/secrets.
# For local development, pass REDIS_PASSWORD via environment and configure ACL
# using your deployment/managed Redis provider. Do not commit real credentials.

# Persistence: enable AOF for local durability. For ephemeral queues/cache,
# choose persistence based on the application's recovery requirements.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Avoid memory exhaustion. Tune to available RAM and workload.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
